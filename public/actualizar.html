<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Actualizando HCU 008</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #edf7f2; color: #12372a; }
    main { width: min(520px, calc(100% - 40px)); padding: 36px; border: 1px solid #a9d7c3; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(15, 76, 55, .12); text-align: center; }
    .spinner { width: 42px; height: 42px; margin: 0 auto 20px; border: 4px solid #dcefe6; border-top-color: #137354; border-radius: 50%; animation: girar .8s linear infinite; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0; color: #526d63; line-height: 1.55; }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Actualizando HCU 008</h1>
    <p id="estado" role="status">Eliminando archivos antiguos y cargando la versión más reciente…</p>
  </main>
  <script>
    (async () => {
      try {
        const parametros = new URLSearchParams(location.search);
        if (parametros.get('limpio') === '1') {
          location.replace('/app?actualizado=' + Date.now());
          return;
        }

        if ('serviceWorker' in navigator) {
          const registros = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registros.map(registro => registro.unregister()));
        }

        if ('caches' in window) {
          const nombres = await caches.keys();
          await Promise.all(nombres.map(nombre => caches.delete(nombre)));
        }

        location.replace('/actualizar.html?limpio=1&momento=' + Date.now());
      } catch (error) {
        document.getElementById('estado').textContent = 'No se pudo actualizar automáticamente. Cierre HCU 008, vuelva a abrirla y presione Ctrl + F5.';
      }
    })();
  </script>
</body>
</html>
