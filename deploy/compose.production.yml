services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${HCU_SQL_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
      - sql-backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=Hcu008Db;User Id=sa;Password=${HCU_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: "${HCU_JWT_KEY}"
      Jwt__Issuer: "${HCU_JWT_ISSUER}"
      Jwt__Audience: "${HCU_JWT_AUDIENCE}"
      Jwt__ExpiresMinutes: "120"
      Database__ApplyMigrationsOnStartup: "true"
      Security__RequireHttps: "true"
      Security__TrustForwardedHeaders: "true"
      Security__RequireExternalSecrets: "true"
      BootstrapAdmin__Enabled: "${HCU_BOOTSTRAP_ENABLED}"
      BootstrapAdmin__Email: "${HCU_ADMIN_EMAIL}"
      BootstrapAdmin__Password: "${HCU_ADMIN_PASSWORD}"
      BootstrapAdmin__Nombres: "${HCU_ADMIN_NOMBRES}"
      BootstrapAdmin__Apellidos: "${HCU_ADMIN_APELLIDOS}"
      AllowedHosts: "${HCU_DOMAIN}"
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      HCU_DOMAIN: "${HCU_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sql-data:
  sql-backups:
  caddy-data:
  caddy-config:
